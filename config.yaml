# evtrill configuration
#
# evtrill grabs your keyboard, runs each configured pair of keys through its
# own state machine, and re-emits everything through one virtual keyboard.
# A pair's keys keep their own codes; evtrill decides only when they go down
# and up. Keys in no pair pass through untouched.
#
# This is the packaged default. To change it, copy it to
# /etc/evtrill/config.yaml, edit it there, and restart the daemon:
#
#   sudo systemctl restart evtrill
#
# The schema is closed: an unknown or repeated key anywhere is an error, so a
# typo stops the daemon instead of running it on defaults.

# Keyboards to grab. OPTIONAL. Omitted (or "auto"), evtrill grabs every
# keyboard that has every pair's keys, and picks up hotplugged ones. To pin
# specific keyboards, list their stable /dev/input/by-id/*-event-kbd paths:
#
# devices:
#   - /dev/input/by-id/CHANGE-ME-event-kbd

# The mode, for every pair that does not set its own. OPTIONAL, default trill.
#
#   trill   With both keys held, every stroke or release of either key is the
#           next note, alternating. Hold one key and tap the other, and each
#           stroke is two notes. Built for rocking.
#   last    The newest stroke wins: it suppresses the older key, releasing the
#           active key falls back to the one still held, and releasing the
#           suppressed one does nothing. What Razer sells as Snap Tap and
#           Wooting as Snappy Tappy.
#   analog  Needs an analog keyboard (see `analog` below). Each key is
#           independent until both are planted on the backplate, then the
#           pair trills until both leave it. Without an analog board it falls
#           back to trill, with a warning.
mode: trill

# The pairs. REQUIRED, up to 8. Each pair is two keys with its own state
# machine, so keys from two different pairs held together are two notes,
# never a trill. No key may be in two pairs.
#
#   keys  REQUIRED. The two keys, by name ("KEY_Z") or code (44); see
#         /usr/include/linux/input-event-codes.h.
#   mode  OPTIONAL. Overrides the top-level `mode`.
#   hid   OPTIONAL, analog only. The two keys' HID usage ids, either of which
#         may be "auto". Read from the keyboard's own keymap unless pinned
#         here; `evtrill -A` shows them.
pairs:
  - { keys: [KEY_Z, KEY_X] }

# osu!taiko, with one analog pair per colour:
#
# mode: analog
# pairs:
#   - { keys: [KEY_D, KEY_F] }   # kats
#   - { keys: [KEY_J, KEY_K] }   # dons
#
# A big note is a 2B: both keys of one pair struck together. Set a non-zero
# latch_debounce_ms so a 2B that reaches the backplate does not arm the latch.

# Analog mode. OPTIONAL, read only when some pair is `mode: analog`.
#
# An analog board reports how far each key is pressed, which lets one pair
# serve both ways of playing it:
#
#   alt-tapping  Alternating strokes, one finger each. The keys must stay
#                independent: at speed the strokes overlap, and a trill
#                answers an overlap with a phantom note.
#   rocking      Both fingers planted, rocking between the keys. The pair
#                must trill, so every lift and landing is a note.
#
# The latch decides which. It ARMS on a plant, both keys on the backplate at
# once, and DISARMS when both have left it. Alt-tapping never plants: its
# shape is one finger leaving as the other arrives. While independent, each
# key goes down at actuation_mm and runs a rapid trigger. While armed, the
# backplate is the switch: a key is down while it is on the backplate and up
# as soon as it leaves, so every note of a burst lands at the same depth.
# Arming and disarming emit no notes of their own.
#
# Pick numbers against your own hands with `evtrill -A` (live depth), or record
# with `evtrill -T > trace.csv` and check it with the `replay` tool: recorded
# alt-tapping should arm the latch zero times.
#
# Turn OFF the keyboard's own rapid trigger and SOCD settings (Snappy Tappy,
# Rappy Snappy) in its configuration tool; evtrill does both, and the
# on-board versions fight it.
#
# analog:
#   device: auto          # or an explicit /dev/hidrawN
#   travel_mm: 4.0        # full key travel (a Wooting 60HE+ is 4.0)
#   actuation_mm: 1.0     # depth at which an independent key goes down
#   backplate_mm: 0.2     # where the backplate starts, measured up from full
#                         # travel: 0.2 on a 4.0mm switch is 95%. Reaching it
#                         # always presses an independent key, both keys on
#                         # it arm the latch, and while armed it is the only
#                         # threshold. Must be > 0. Keep it under ~10% of
#                         # travel, or a firm stroke reaches it and
#                         # alt-tapping can arm the latch.
#   latch_debounce_ms: 0  # how long a plant must last before the latch arms.
#                         # 0 arms at once. Raise it if 2Bs or hard alt-taps
#                         # arm it by accident; a real plant lasts far longer.
#                         # Until it runs out the keys stay independent, so
#                         # the cost is only that the trill starts later.
#   rapid_trigger:        # independent keys only
#     enabled: true
#     press_mm: 0.3       # downward reversal that re-presses
#     release_mm: 0.3     # upward reversal that releases

# The virtual keyboard's name.
uinput:
  name: "evtrill virtual keyboard"
